indexpage:
  title: Documentación de Keystone
  summary: Keystone STaaS es una oferta de suscripción de la plataforma NetApp Keystone
    que proporciona servicios de almacenamiento de archivos, en bloque y de objetos
    mediante un modelo de pago por uso.
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: NetApp Keystone es la plataforma de almacenamiento como servicio (STaaS) de
    NetApp. Keystone Storage-as-a-Service (STaaS), una oferta de suscripción dentro
    de Keystone, proporciona servicios de almacenamiento de archivos, de bloques y
    de objetos mediante un modelo de pago por uso. Keystone STaaS permite a las organizaciones
    consumir almacenamiento como gastos operativos en lugar de realizar una inversión
    de capital inicial.
